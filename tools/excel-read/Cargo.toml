[package]
name = "excel-read"
version = "0.1.0"
edition = "2021"
publish = false
description = "エージェントが Excel を読むための道具（skills/excel-read）"

[dependencies]
calamine = { version = "0.37", features = ["dates"] }
chrono = { version = "0.4", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
