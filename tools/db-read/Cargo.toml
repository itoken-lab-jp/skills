[package]
name = "db-read"
version = "0.1.0"
edition = "2021"
publish = false
description = "エージェントが DB を読むための道具（skills/db-read）"

[dependencies]
oracledb = "=26.0.0-beta.5"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
mysql = { path = "vendor/mysql" }
